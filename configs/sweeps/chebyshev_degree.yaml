# Sweep configuration for Chebyshev polynomial degree and probe count
# Tests accuracy-efficiency tradeoffs in VNGE estimation
seed: 42
steps: 500
batch_size: 8
max_length: 128
max_tokens: 512
learning_rate: 3.0e-4
lambda_vnge: 0.1
dataset_name: wikitext
dataset_config: wikitext-2-raw-v1
tokenizer_name: gpt2
vnge_window: 8

# Grid of Chebyshev degrees and probe counts
sweep_grid:
  - vnge_cheb_order: 5
    vnge_probes: 1
  - vnge_cheb_order: 5
    vnge_probes: 4
  - vnge_cheb_order: 5
    vnge_probes: 8
  - vnge_cheb_order: 10
    vnge_probes: 1
  - vnge_cheb_order: 10
    vnge_probes: 4
  - vnge_cheb_order: 10
    vnge_probes: 8
  - vnge_cheb_order: 20
    vnge_probes: 1
  - vnge_cheb_order: 20
    vnge_probes: 4
  - vnge_cheb_order: 20
    vnge_probes: 8
  - vnge_cheb_order: 30
    vnge_probes: 1
  - vnge_cheb_order: 30
    vnge_probes: 4
  - vnge_cheb_order: 30
    vnge_probes: 8
